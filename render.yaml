# NITKA — Render Blueprint (free tier, services may sleep)
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: nitka-db
    plan: free
    databaseName: wedding
    user: wedding

services:
  - type: web
    name: nitka-api
    runtime: node
    plan: free
    rootDir: apps/api
    # CRITICAL: Dashboard Build/Start часто НЕ sync з blueprint → OOM від nest build.
    # У Settings → Build Command постав ТОЧНО:
    #   bash scripts/render-build.sh
    # Start Command:
    #   npm run start:prod
    buildCommand: bash scripts/render-build.sh
    startCommand: npm run start:prod
    healthCheckPath: /api/categories
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nitka-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://nitka-web.onrender.com
      - key: PUBLIC_API_URL
        value: https://nitka-api.onrender.com
      - key: WEB_APP_URL
        value: https://nitka-web.onrender.com
      # Optional email (set in Render dashboard):
      # EMAIL_FROM, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS
      # Optional Cloudinary: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET

  - type: web
    name: nitka-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://nitka-api.onrender.com
      - key: API_URL
        value: https://nitka-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://nitka-web.onrender.com
